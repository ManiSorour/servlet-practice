<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کالاهای انبار</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="main-header">
        <h1>مدیریت کالا</h1>
    </div>
</header>

<main class="container">
    <section class="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو بر اساس دسته بندی">
            <button id="searchBtn" class="btn btn-primary"> جستجو</button>
            <button id="clearSearchBtn" class="btn btn-remove">پاک کردن</button>
        </div>
        <button id="openAddFormBtn" class="btn btn-accent">+ افزودن کالا</button>
    </section>

    <section class="table">

        <table id="product-table">

            <thead>
            <tr>
                <th>شناسه</th>
                <th>نام کالا</th>
                <th>کد</th>
                <th>دسته‌بندی</th>
                <th>موجودی</th>
                <th>وضعیت</th>
                <th>قیمت خرید</th>
                <th>قیمت فروش</th>
                <th>عملیات</th>
            </tr>
            </thead>
            <tbody id="productTableBody">

            </tbody>
        </table>
        <p id="emptyState" class="empty-state" hidden>کالایی برای نمایش وجود ندارد.</p>
    </section>
</main>

<div id="productModal" class="modal-overlay" hidden>
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">افزودن کالای جدید</h2>
            <button id="closeModalBtn" class="modal-close">&times;</button>
        </div>
        <form id="productForm">
            <input type="hidden" id="productId">
            <label>نام کالا
                <input type="text" id="nameField" required>
            </label>

            <label>کد کالا
                <input type="text" id="codeField" required>
            </label>

            <label>دسته‌بندی
                <input type="text" id="categoryField" required>
            </label>

            <label>موجودی
                <input type="number" id="quantityField" min="0" required>
            </label>

            <label>قیمت خرید
                <input type="number" id="purchasePriceField" min="0" step="0.01" required>
            </label>

            <label>قیمت فروش
                <input type="number" id="sellPriceField" min="0" step="0.01" required>
            </label>

            <p id="formError" class="form-error" hidden></p>
            <div class="modal-actions">
                <button type="button" id="cancelFormBtn" class="btn btn-ghost">انصراف</button>
                <button type="submit" class="btn btn-accent">ذخیره</button>
            </div>
        </form>
    </div>
</div>

<script src="Thejs.js"></script>

</body>
</html>
